        const createEmptyLocaleData = () => ({
            personalInfo: { ...emptyCvDataTemplate.personalInfo },
            summary: '',
            experiences: [],
            education: [],
            skills: {
                programmingLanguages: [],
                frameworks: [],
                databases: [],
                tools: [],
            },
            projects: [],
            awards: [],
        });

        const isObject = (value) => value !== null && typeof value === 'object' && !Array.isArray(value);

        const toStringSafe = (value) => {
            if (value === null || value === undefined) {
                return '';
            }
            if (typeof value === 'string') {
                return value;
            }
            if (typeof value === 'number' || typeof value === 'boolean') {
                return String(value);
            }
            return '';
        };

        const coerceToStringArray = (value) => {
            if (Array.isArray(value)) {
                return value
                    .map(item => toStringSafe(item).trim())
                    .filter(Boolean);
            }

            if (typeof value === 'string') {
                return value
                    .split(/\n|,/) // Support comma-separated and line-separated inputs
                    .map(item => item.trim())
                    .filter(Boolean);
            }

            if (isObject(value)) {
                if (Array.isArray(value.items)) {
                    return coerceToStringArray(value.items);
                }
                if (Array.isArray(value.list)) {
                    return coerceToStringArray(value.list);
                }
                if (Array.isArray(value.values)) {
                    return coerceToStringArray(value.values);
                }
                return Object.values(value)
                    .flatMap(item => coerceToStringArray(item))
                    .filter(Boolean);
            }

            return [];
        };

        const normalizePersonalInfo = (personalInfoInput) => {
            const merged = {
                ...emptyCvDataTemplate.personalInfo,
                ...(isObject(personalInfoInput) ? personalInfoInput : {}),
            };

            const width = Number(merged.profilePictureWidth);
            const height = Number(merged.profilePictureHeight);

            const frameColor = toStringSafe(merged.profileFrameColor).trim();

            return {
                ...merged,
                name: toStringSafe(merged.name),
                title: toStringSafe(merged.title),
                email: toStringSafe(merged.email),
                phone: toStringSafe(merged.phone),
                linkedin: toStringSafe(merged.linkedin),
                github: toStringSafe(merged.github),
                website: toStringSafe(merged.website),
                address: toStringSafe(merged.address),
                profilePicture: toStringSafe(merged.profilePicture),
                profileFrameColor: /^#([0-9a-fA-F]{6})$/.test(frameColor) ? frameColor : emptyCvDataTemplate.personalInfo.profileFrameColor,
                profilePictureWidth: Number.isFinite(width) ? width : null,
                profilePictureHeight: Number.isFinite(height) ? height : null,
            };
        };

        const normalizeExperiences = (experiencesInput) => {
            if (!Array.isArray(experiencesInput)) {
                return [];
            }

            return experiencesInput.map((item, index) => {
                const source = isObject(item) ? item : {};
                const description = coerceToStringArray(source.description);
                return {
                    ...source,
                    id: Number.isFinite(Number(source.id)) ? Number(source.id) : index + 1,
                    title: toStringSafe(source.title),
                    company: toStringSafe(source.company),
                    location: toStringSafe(source.location),
                    startDate: toStringSafe(source.startDate),
                    endDate: toStringSafe(source.endDate),
                    description: description.length > 0 ? description : [''],
                };
            });
        };

        const normalizeEducation = (educationInput) => {
            if (!Array.isArray(educationInput)) {
                return [];
            }

            return educationInput.map((item, index) => {
                const source = isObject(item) ? item : {};
                return {
                    ...source,
                    id: Number.isFinite(Number(source.id)) ? Number(source.id) : index + 1,
                    degree: toStringSafe(source.degree),
                    university: toStringSafe(source.university),
                    location: toStringSafe(source.location),
                    year: toStringSafe(source.year),
                    details: toStringSafe(source.details),
                };
            });
        };

        const normalizeProjects = (projectsInput) => {
            if (!Array.isArray(projectsInput)) {
                return [];
            }

            return projectsInput.map((item, index) => {
                const source = isObject(item) ? item : {};
                return {
                    ...source,
                    id: Number.isFinite(Number(source.id)) ? Number(source.id) : index + 1,
                    name: toStringSafe(source.name),
                    technologies: toStringSafe(source.technologies),
                    description: toStringSafe(source.description),
                    link: toStringSafe(source.link),
                };
            });
        };

        const normalizeAwards = (awardsInput) => {
            if (!Array.isArray(awardsInput)) {
                return [];
            }

            return awardsInput.map((item, index) => {
                const source = isObject(item) ? item : {};
                return {
                    ...source,
                    id: Number.isFinite(Number(source.id)) ? Number(source.id) : index + 1,
                    name: toStringSafe(source.name),
                    year: toStringSafe(source.year),
                    description: toStringSafe(source.description),
                };
            });
        };

        const normalizeSkills = (skillsInput) => {
            const normalizedSkills = { ...createEmptyLocaleData().skills };

            if (!isObject(skillsInput)) {
                return normalizedSkills;
            }

            Object.entries(skillsInput).forEach(([category, value]) => {
                normalizedSkills[category] = coerceToStringArray(value);
            });

            return normalizedSkills;
        };

        const localeSectionKeys = ['personalInfo', 'summary', 'experiences', 'education', 'skills', 'projects', 'awards'];

        const looksLikeLocaleData = (value) => {
            if (!isObject(value)) {
                return false;
            }

            return localeSectionKeys.some(section => Object.prototype.hasOwnProperty.call(value, section));
        };

        const normalizeLocaleData = (localeInput) => {
            const source = isObject(localeInput) ? localeInput : {};
            const emptyLocale = createEmptyLocaleData();

            return {
                ...emptyLocale,
                ...source,
                personalInfo: normalizePersonalInfo(source.personalInfo),
                summary: toStringSafe(source.summary),
                experiences: normalizeExperiences(source.experiences),
                education: normalizeEducation(source.education),
                skills: normalizeSkills(source.skills),
                projects: normalizeProjects(source.projects),
                awards: normalizeAwards(source.awards),
            };
        };

        const getLocaleShapeWarnings = (localeKey, localeData) => {
            const warnings = [];

            if (!isObject(localeData)) {
                warnings.push(`${localeKey}: missing locale object, defaults were used.`);
                return warnings;
            }

            if (localeData.summary !== undefined && typeof localeData.summary !== 'string') {
                warnings.push(`${localeKey}.summary was not a string and was normalized.`);
            }

            const expectedArraySections = ['experiences', 'education', 'projects', 'awards'];
            expectedArraySections.forEach((section) => {
                if (localeData[section] !== undefined && !Array.isArray(localeData[section])) {
                    warnings.push(`${localeKey}.${section} was not an array and was reset.`);
                }
            });

            if (localeData.skills !== undefined && !isObject(localeData.skills)) {
                warnings.push(`${localeKey}.skills was not an object and was reset.`);
            }

            return warnings;
        };

        const normalizeImportedDataWithReport = (rawData) => {
            if (!isObject(rawData)) {
                throw new Error('Invalid import payload: expected object.');
            }

            const warnings = [];

            if (isObject(rawData.meta) && Number(rawData.meta.schemaVersion) > CURRENT_SCHEMA_VERSION) {
                warnings.push('Imported data is from a newer schema version; best-effort migration applied.');
            }

            if (isObject(rawData.meta) && !isObject(rawData.data)) {
                warnings.push('Expected wrapped data under data, used fallback parsing.');
            }

            const payload = isObject(rawData.data) ? rawData.data : rawData;

            if (looksLikeLocaleData(payload)) {
                warnings.push('Single-locale import detected; mapped payload to en and reset es.');
                warnings.push(...getLocaleShapeWarnings('en', payload));
                return {
                    data: {
                        en: normalizeLocaleData(payload),
                        es: createEmptyLocaleData(),
                    },
                    warnings,
                };
            }

            warnings.push(...getLocaleShapeWarnings('en', payload.en));
            warnings.push(...getLocaleShapeWarnings('es', payload.es));

            return {
                data: {
                    en: normalizeLocaleData(payload.en),
                    es: normalizeLocaleData(payload.es),
                },
                warnings,
            };
        };

        const normalizeImportedData = (rawData) => {
            const { data } = normalizeImportedDataWithReport(rawData);
            return data;
        };

        // Main App component for the CV Builder
        const App = () => {
            // State for current language (locale)
            const [locale, setLocale] = React.useState('en');
            const t = translations[locale]; // Shorthand for translations based on current locale


            // Function to get initial data from local storage or use defaults
            const getInitialData = () => {
                try {
                    const storedData = localStorage.getItem('cvData');
                    if (storedData) {
                        const parsedData = JSON.parse(storedData);
                        return normalizeImportedData(parsedData);
                    }
                } catch (error) {
                    console.error("Failed to parse data from localStorage:", error);
                    // If an error occurs, fall back to the default data.
                }
                return initialCvDataByLocale;
            };

            // State variables to hold CV data for both locales
            const [cvDataByLocale, setCvDataByLocale] = React.useState(getInitialData);
            // State variables to hold CV data for both locales
            //const [cvDataByLocale, setCvDataByLocale] = React.useState(initialCvDataByLocale);

            // Destructure current locale's CV data for easier access
            const { personalInfo, summary, experiences, education, skills, projects, awards } = cvDataByLocale[locale];

            const formatCategoryLabel = (category) => {
                if (t[category]) {
                    return t[category];
                }

                return category
                    .replace(/([a-z])([A-Z])/g, '$1 $2')

            // Generic update function for CV data based on current locale
            const updateCvData = (section, id, field, value, index = null) => {

            // Function to handle image file upload and crop to square

                            const x = (img.naturalWidth - size) / 2; // X-coordinate to start crop
                            const y = (img.naturalHeight - size) / 2; // Y-coordinate to start crop

                            const displaySize = 150; // Desired size for display and PDF

                            canvas.width = displaySize;
                            canvas.height = displaySize;

                            // Draw the cropped portion of the image onto the canvas, scaled to displaySize
                            context.drawImage(img, x, y, size, size, 0, 0, displaySize, displaySize);

            const getSafePdfFileName = () => {

            // New exporter: writes real text to the PDF instead of a rasterized image.
            const exportToPdf = async () => {
                try {
                    const JsPDF = await loadJsPdf();
                    const doc = new JsPDF({
                        orientation: 'portrait',
                        unit: 'pt',
                        format: 'a4',
                    });

                    const pageWidth = doc.internal.pageSize.getWidth();
                    const pageHeight = doc.internal.pageSize.getHeight();
                    const margin = 44;
                    const contentWidth = pageWidth - (margin * 2);
                    let y = margin;

                    const pdfTheme = {
                        sectionTitleSize: 13,
                        sectionTitleSpacingTop: 6,
                        sectionTitleSpacingBottom: 14,
                        nameSize: 22,
                        roleSize: 13,
                        bodySize: 10,
                        bodyLineHeight: 15,
                        compactSize: 9,
                        compactLineHeight: 13,
                        itemTitleSize: 11,
                        itemTitleLineHeight: 15,
                        textColor: [55, 65, 81],
                        headingColor: [17, 24, 39],
                        accentColor: [37, 99, 235],
                        mutedColor: [107, 114, 128],
                        avatarSize: 96,
                        avatarCanvasSize: 420,
                        avatarOuterInset: 18,
                        avatarFramePadding: 2,
                        avatarFrameWidth: 6,
                        avatarShadowColor: 'rgba(15, 23, 42, 0.22)',
                        avatarShadowBlur: 14,
                        avatarShadowOffsetY: 6,
                        avatarBottomSpacing: 26,
                    };

                    const ensurePageSpace = (requiredHeight = 18) => {
                        if (y + requiredHeight > pageHeight - margin) {
                            doc.addPage();
                            y = margin;
                        }
                    };

                    const forceBreakLongLine = (line, maxWidth) => {
                        if (doc.getTextWidth(line) <= maxWidth) {
                            return [line];
                        }

                        const chunks = [];
                        let current = '';

                        for (const char of line) {
                            const candidate = `${current}${char}`;
                            if (doc.getTextWidth(candidate) <= maxWidth) {
                                current = candidate;
                            } else {
                                if (current) {
                                    chunks.push(current);
                                    current = char;
                                } else {
                                    // Safety guard for very narrow widths: keep progress character by character.
                                    chunks.push(char);
                                    current = '';
                                }
                            }
                        }

                        if (current) {
                            chunks.push(current);
                        }

                        return chunks;
                    };

                    const getWrappedLines = (text, maxWidth) => {
                        const value = toStringSafe(text).trim();
                        if (!value) {
                            return [];
                        }

                        const paragraphs = value.replace(/\r/g, '').split('\n');
                        const wrappedLines = [];

                        paragraphs.forEach((paragraph, paragraphIndex) => {
                            const paragraphText = paragraph.trim();
                            if (!paragraphText) {
                                wrappedLines.push('');
                                return;
                            }

                            const tokens = paragraphText.split(/\s+/).filter(Boolean);
                            let currentLine = '';

                            tokens.forEach((token) => {
                                const candidate = currentLine ? `${currentLine} ${token}` : token;

                                if (doc.getTextWidth(candidate) <= maxWidth) {
                                    currentLine = candidate;
                                    return;
                                }

                                if (currentLine) {
                                    wrappedLines.push(currentLine);
                                    currentLine = '';
                                }

                                if (doc.getTextWidth(token) <= maxWidth) {
                                    currentLine = token;
                                    return;
                                }

                                const forcedTokenLines = forceBreakLongLine(token, maxWidth);
                                if (forcedTokenLines.length > 0) {
                                    wrappedLines.push(...forcedTokenLines.slice(0, -1));
                                    currentLine = forcedTokenLines[forcedTokenLines.length - 1];
                                }
                            });

                            if (currentLine) {
                                wrappedLines.push(currentLine);
                            }

                            if (paragraphIndex < paragraphs.length - 1) {
                                wrappedLines.push('');
                            }
                        });

                        return wrappedLines;
                    };

                    const estimateWrappedHeight = (text, maxWidth, fontSize, lineHeight) => {
                        const value = toStringSafe(text).trim();
                        if (!value) {
                            return 0;
                        }
                        doc.setFontSize(fontSize);
                        const lines = getWrappedLines(value, maxWidth);
                        return lines.length * lineHeight;
                    };

                    const estimateBulletListHeight = (items, lineHeight = 14) => {
                        const cleanItems = items.map(item => toStringSafe(item).trim()).filter(Boolean);
                        return cleanItems.reduce((total, item) => {
                            doc.setFont('helvetica', 'normal');
                            doc.setFontSize(pdfTheme.bodySize);
                            const lines = getWrappedLines(item, contentWidth - 14);
                            return total + (lines.length * lineHeight);
                        }, 0);
                    };

                    const writeWrapped = (text, options = {}) => {
                        const value = toStringSafe(text).trim();
                        if (!value) {
                            return;
                        }

                        const x = options.x ?? margin;
                        const maxWidth = options.maxWidth ?? contentWidth;
                        const fontSize = options.fontSize ?? 10;
                        const lineHeight = options.lineHeight ?? Math.round(fontSize * 1.45);
                        const color = options.color ?? pdfTheme.textColor;
                        const isBold = Boolean(options.bold);

                        doc.setFont('helvetica', isBold ? 'bold' : 'normal');
                        doc.setFontSize(fontSize);
                        doc.setTextColor(...color);

                        const lines = getWrappedLines(value, maxWidth);
                        ensurePageSpace(lines.length * lineHeight + 2);

                        lines.forEach((line) => {
                            doc.text(line, x, y);
                            y += lineHeight;
                        });
                    };

                    const writeCentered = (text, options = {}) => {
                        const value = toStringSafe(text).trim();
                        if (!value) {
                            return;
                        }

                        const fontSize = options.fontSize ?? 16;
                        const lineHeight = options.lineHeight ?? Math.round(fontSize * 1.35);
                        const color = options.color ?? pdfTheme.headingColor;
                        const isBold = Boolean(options.bold);

                        doc.setFont('helvetica', isBold ? 'bold' : 'normal');
                        doc.setFontSize(fontSize);
                        doc.setTextColor(...color);

                        ensurePageSpace(lineHeight + 2);
                        doc.text(value, pageWidth / 2, y, { align: 'center' });
                        y += lineHeight;
                    };

                    const writeLinkLine = (text, url, options = {}) => {
                        const value = toStringSafe(text).trim();
                        const href = toAbsoluteUrl(url);
                        if (!value || !href) {
                            return;
                        }

                        const x = options.x ?? margin;
                        const fontSize = options.fontSize ?? pdfTheme.bodySize;
                        const lineHeight = options.lineHeight ?? Math.round(fontSize * 1.4);

                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(fontSize);
                        doc.setTextColor(...pdfTheme.accentColor);

                        const lines = getWrappedLines(value, contentWidth);
                        ensurePageSpace((lines.length * lineHeight) + 2);

                        lines.forEach((line) => {
                            doc.text(line, x, y);
                            const width = doc.getTextWidth(line);
                            doc.setDrawColor(...pdfTheme.accentColor);
                            doc.setLineWidth(0.6);
                            doc.line(x, y + 1.5, x + width, y + 1.5);
                            doc.link(x, y - fontSize, width, lineHeight + 2, { url: href });
                            y += lineHeight;
                        });
                    };

                    const writeSectionTitle = (title) => {
                        const value = toStringSafe(title).trim();
                        if (!value) {
                            return;
                        }

                        y += pdfTheme.sectionTitleSpacingTop;
                        ensurePageSpace(24);
                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(pdfTheme.sectionTitleSize);
                        doc.setTextColor(...pdfTheme.headingColor);
                        doc.text(value, margin, y);
                        y += 8;
                        doc.setDrawColor(226, 232, 240);
                        doc.line(margin, y, pageWidth - margin, y);
                        y += pdfTheme.sectionTitleSpacingBottom;
                    };

                    const writeSectionWithKeep = (title, estimatedFirstItemHeight = 0) => {
                        const minRequired = 24 + Math.max(0, estimatedFirstItemHeight);
                        ensurePageSpace(minRequired);
                        writeSectionTitle(title);
                    };

                    const buildCircularAvatarDataUrl = (imageDataUrl, options = {}) => {
                        return new Promise((resolve, reject) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvasSize = options.canvasSize ?? 320;
                                const outerInset = options.outerInset ?? 14;
                                const framePadding = options.framePadding ?? 3;
                                const frameWidth = options.frameWidth ?? 6;
                                const frameColor = options.frameColor ?? '#bfdbfe';
                                const shadowColor = options.shadowColor ?? 'rgba(15, 23, 42, 0.22)';
                                const shadowBlur = options.shadowBlur ?? 16;
                                const shadowOffsetY = options.shadowOffsetY ?? 8;

                                const canvas = document.createElement('canvas');
                                canvas.width = canvasSize;
                                canvas.height = canvasSize;

                                const ctx = canvas.getContext('2d');
                                if (!ctx) {
                                    reject(new Error('Canvas context is not available for avatar rendering.'));
                                    return;
                                }

                                const center = canvasSize / 2;
                                const outerRadius = center - outerInset;
                                const frameRadius = outerRadius - framePadding;
                                const imageRadius = frameRadius - frameWidth;

                                const sourceSize = Math.min(img.naturalWidth, img.naturalHeight);
                                const sourceX = (img.naturalWidth - sourceSize) / 2;
                                const sourceY = (img.naturalHeight - sourceSize) / 2;

                                ctx.clearRect(0, 0, canvasSize, canvasSize);

                                // Shadow layer to mimic preview depth.
                                ctx.save();
                                ctx.shadowColor = shadowColor;
                                ctx.shadowBlur = shadowBlur;
                                ctx.shadowOffsetX = 0;
                                ctx.shadowOffsetY = shadowOffsetY;
                                ctx.fillStyle = '#ffffff';
                                ctx.beginPath();
                                ctx.arc(center, center, outerRadius, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.restore();

                                // White base so transparent corners look clean in PDF viewers.
                                ctx.fillStyle = '#ffffff';
                                ctx.beginPath();
                                ctx.arc(center, center, outerRadius, 0, Math.PI * 2);
                                ctx.fill();

                                // Blue frame similar to preview border color.
                                ctx.fillStyle = frameColor;
                                ctx.beginPath();
                                ctx.arc(center, center, frameRadius, 0, Math.PI * 2);
                                ctx.fill();

                                // Thin inner highlight improves separation from the image.
                                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                                ctx.lineWidth = 2;
                                ctx.beginPath();
                                ctx.arc(center, center, imageRadius + 1, 0, Math.PI * 2);
                                ctx.stroke();

                                // Circular clip for the image itself.
                                ctx.save();
                                ctx.beginPath();
                                ctx.arc(center, center, imageRadius, 0, Math.PI * 2);
                                ctx.closePath();
                                ctx.clip();
                                ctx.drawImage(
                                    img,
                                    sourceX,
                                    sourceY,
                                    sourceSize,
                                    sourceSize,
                                    center - imageRadius,
                                    center - imageRadius,
                                    imageRadius * 2,
                                    imageRadius * 2
                                );
                                ctx.restore();

                                resolve(canvas.toDataURL('image/png'));
                            };

                            img.src = imageDataUrl;
                        });
