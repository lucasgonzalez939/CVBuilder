                    const writeInlineContactRows = (chunks, options = {}) => {
                        const fontSize = options.fontSize ?? pdfTheme.bodySize;
                        const lineHeight = options.lineHeight ?? pdfTheme.bodyLineHeight;
                        const separator = options.separator ?? ' | ';

                        const validChunks = chunks
                            .map(chunk => ({
                                text: toStringSafe(chunk.text).trim(),
                                url: chunk.url ? toAbsoluteUrl(chunk.url) : '',
                                color: chunk.color,
                            }))
                            .filter(chunk => Boolean(chunk.text));

                        if (validChunks.length === 0) {
                            return;
                        }

                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(fontSize);

                        const maxX = margin + contentWidth;
                        const separatorWidth = doc.getTextWidth(separator);
                        let cursorX = margin;

                        const drawSegment = (text, color, url = '') => {
                            const segmentText = toStringSafe(text);
                            if (!segmentText) {
                                return;
                            }

                            doc.setTextColor(...color);
                            doc.text(segmentText, cursorX, y);
                            const width = doc.getTextWidth(segmentText);

                            if (url) {
                                doc.setDrawColor(...pdfTheme.accentColor);
                                doc.setLineWidth(0.5);
                                doc.line(cursorX, y + 1.5, cursorX + width, y + 1.5);
                                doc.link(cursorX, y - fontSize, width, lineHeight + 2, { url });
                            }

                            cursorX += width;
                        };

                        ensurePageSpace(lineHeight + 2);

                        validChunks.forEach((chunk, index) => {
                            const chunkWidth = doc.getTextWidth(chunk.text);
                            const isLink = Boolean(chunk.url);

                            if (index > 0 && cursorX > margin) {
                                if (cursorX + separatorWidth > maxX) {
                                    y += lineHeight;
                                    ensurePageSpace(lineHeight + 2);
                                    cursorX = margin;
                                } else {
                                    drawSegment(separator, [107, 114, 128]);
                                }
                            }

                            if (cursorX + chunkWidth <= maxX) {
                                drawSegment(chunk.text, isLink ? pdfTheme.accentColor : (chunk.color ?? [75, 85, 99]), chunk.url);
                                return;
                            }

                            if (cursorX > margin) {
                                y += lineHeight;
                                ensurePageSpace(lineHeight + 2);
                                cursorX = margin;
                            }

                            if (doc.getTextWidth(chunk.text) <= contentWidth) {
                                drawSegment(chunk.text, isLink ? pdfTheme.accentColor : (chunk.color ?? [75, 85, 99]), chunk.url);
                                return;
                            }

                            const wrapped = getWrappedLines(chunk.text, contentWidth);
                            wrapped.forEach((line, lineIndex) => {
                                if (lineIndex > 0) {
                                    y += lineHeight;
                                    ensurePageSpace(lineHeight + 2);
                                    cursorX = margin;
                                }
                                drawSegment(line, isLink ? pdfTheme.accentColor : (chunk.color ?? [75, 85, 99]), chunk.url);
                                if (lineIndex < wrapped.length - 1) {
                                    cursorX = margin;
                                }
                            });
                        });

                        y += lineHeight;
                    };

                    const writeBulletList = (items) => {
                        const bulletLineHeight = 14;
                        items
                            .map(item => toStringSafe(item).trim())
                            .filter(Boolean)
                            .forEach((item) => {
                                const bulletX = margin + 4;
                                const textX = margin + 14;
                                doc.setFont('helvetica', 'normal');
                                doc.setFontSize(pdfTheme.bodySize);
                                const lines = getWrappedLines(item, contentWidth - 14);
                                ensurePageSpace((lines.length * bulletLineHeight) + 2);
                                doc.setTextColor(...pdfTheme.textColor);
                                doc.text('•', bulletX, y);
                                lines.forEach((line, idx) => {
                                    doc.text(line, textX, y + (idx * bulletLineHeight));
                                });
                                y += lines.length * bulletLineHeight;
                            });
                    };

                    const localeData = cvDataByLocale[locale];
                    const profile = localeData.personalInfo;

                    const estimateExperienceHeight = (exp) => {
                        const roleLine = [exp.title, exp.company].map(v => toStringSafe(v).trim()).filter(Boolean).join(' - ');
                        const locationAndDates = [exp.location, `${toStringSafe(exp.startDate)} - ${toStringSafe(exp.endDate)}`.trim()]
                            .map(v => toStringSafe(v).trim())
                            .filter(Boolean)
                            .join(' | ');

                        return estimateWrappedHeight(roleLine, contentWidth, pdfTheme.itemTitleSize, pdfTheme.itemTitleLineHeight)
                            + estimateWrappedHeight(locationAndDates, contentWidth, pdfTheme.compactSize, pdfTheme.compactLineHeight)
                            + estimateBulletListHeight(Array.isArray(exp.description) ? exp.description : [])
                            + 10;
                    };

                    const estimateEducationHeight = (edu) => {
                        const degreeLine = [edu.degree, edu.university].map(v => toStringSafe(v).trim()).filter(Boolean).join(' - ');
                        const metaLine = [edu.location, edu.year].map(v => toStringSafe(v).trim()).filter(Boolean).join(' | ');

                        return estimateWrappedHeight(degreeLine, contentWidth, pdfTheme.itemTitleSize, pdfTheme.itemTitleLineHeight)
                            + estimateWrappedHeight(metaLine, contentWidth, pdfTheme.compactSize, pdfTheme.compactLineHeight)
                            + estimateWrappedHeight(edu.details, contentWidth, pdfTheme.bodySize, 14)
                            + 8;
                    };

                    const estimateProjectHeight = (proj) => {
                        return estimateWrappedHeight(proj.name, contentWidth, pdfTheme.itemTitleSize, pdfTheme.itemTitleLineHeight)
                            + estimateWrappedHeight(proj.technologies, contentWidth, pdfTheme.compactSize, pdfTheme.compactLineHeight)
                            + estimateWrappedHeight(proj.description, contentWidth, pdfTheme.bodySize, 14)
                            + estimateWrappedHeight(proj.link, contentWidth, pdfTheme.bodySize, 14)
                            + 8;
                    };

                    const estimateAwardHeight = (award) => {
                        const awardTitle = [award.name, award.year].map(v => toStringSafe(v).trim()).filter(Boolean).join(' - ');
                        return estimateWrappedHeight(awardTitle, contentWidth, pdfTheme.itemTitleSize, pdfTheme.itemTitleLineHeight)
                            + estimateWrappedHeight(award.description, contentWidth, pdfTheme.bodySize, 14)
                            + 8;
                    };

                    if (profile.profilePicture && profile.profilePicture.startsWith('data:image/')) {
                        try {
                            const avatarSize = pdfTheme.avatarSize;
                            const avatarX = (pageWidth - avatarSize) / 2;
                            const circularAvatar = await buildCircularAvatarDataUrl(profile.profilePicture, {
                                canvasSize: pdfTheme.avatarCanvasSize,
                                outerInset: pdfTheme.avatarOuterInset,
                                framePadding: pdfTheme.avatarFramePadding,
                                frameWidth: pdfTheme.avatarFrameWidth,
                                frameColor: profile.profileFrameColor || emptyCvDataTemplate.personalInfo.profileFrameColor,
                                shadowColor: pdfTheme.avatarShadowColor,
                                shadowBlur: pdfTheme.avatarShadowBlur,
                                shadowOffsetY: pdfTheme.avatarShadowOffsetY,
                            });
                            ensurePageSpace(avatarSize + pdfTheme.avatarBottomSpacing + pdfTheme.nameSize);
                            doc.addImage(circularAvatar, 'PNG', avatarX, y, avatarSize, avatarSize);
                            y += avatarSize + pdfTheme.avatarBottomSpacing;
                        } catch (imageError) {
                            console.warn('Skipping profile image in text PDF export:', imageError);
                        }
                    }

                    writeCentered(profile.name, { fontSize: pdfTheme.nameSize, bold: true, color: [15, 23, 42] });
                    writeCentered(profile.title, { fontSize: pdfTheme.roleSize, color: pdfTheme.textColor });
                    y += 4;

                    writeInlineContactRows([
                        { text: profile.email },
                        { text: profile.phone },
                        { text: profile.linkedin, url: profile.linkedin },
                        { text: profile.github, url: profile.github },
                        { text: profile.website, url: profile.website },
                        { text: profile.address },
                    ], {
                        fontSize: pdfTheme.bodySize,
                        lineHeight: pdfTheme.bodyLineHeight,
                    });

                    if (toStringSafe(summary).trim()) {
                        const summaryHeight = estimateWrappedHeight(summary, contentWidth, pdfTheme.bodySize, pdfTheme.bodyLineHeight);
                        writeSectionWithKeep(t.summary, summaryHeight);
                        writeWrapped(summary, { fontSize: pdfTheme.bodySize, lineHeight: pdfTheme.bodyLineHeight, color: pdfTheme.textColor });
                    }

                    if (experiences.length > 0) {
                        writeSectionWithKeep(t.workExperience, estimateExperienceHeight(experiences[0]));
                        experiences.forEach((exp) => {
                            const roleLine = [exp.title, exp.company].map(v => toStringSafe(v).trim()).filter(Boolean).join(' - ');
                            const locationAndDates = [exp.location, `${toStringSafe(exp.startDate)} - ${toStringSafe(exp.endDate)}`.trim()]
                                .map(v => toStringSafe(v).trim())
                                .filter(Boolean)
                                .join(' | ');

                            ensurePageSpace(estimateExperienceHeight(exp));
                            writeWrapped(roleLine, { bold: true, fontSize: pdfTheme.itemTitleSize, lineHeight: pdfTheme.itemTitleLineHeight, color: [31, 41, 55] });
                            writeWrapped(locationAndDates, { fontSize: pdfTheme.compactSize, lineHeight: pdfTheme.compactLineHeight, color: pdfTheme.mutedColor });
                            writeBulletList(Array.isArray(exp.description) ? exp.description : []);
                            y += 6;
                        });
                    }

                    if (education.length > 0) {
                        writeSectionWithKeep(t.education, estimateEducationHeight(education[0]));
                        education.forEach((edu) => {
                            const degreeLine = [edu.degree, edu.university].map(v => toStringSafe(v).trim()).filter(Boolean).join(' - ');
                            const metaLine = [edu.location, edu.year].map(v => toStringSafe(v).trim()).filter(Boolean).join(' | ');

                            ensurePageSpace(estimateEducationHeight(edu));
                            writeWrapped(degreeLine, { bold: true, fontSize: pdfTheme.itemTitleSize, lineHeight: pdfTheme.itemTitleLineHeight, color: [31, 41, 55] });
                            writeWrapped(metaLine, { fontSize: pdfTheme.compactSize, lineHeight: pdfTheme.compactLineHeight, color: pdfTheme.mutedColor });
                            writeWrapped(edu.details, { fontSize: pdfTheme.bodySize, lineHeight: 14, color: pdfTheme.textColor });
                            y += 6;
                        });
                    }

                    if (Object.values(skills).some(arr => Array.isArray(arr) && arr.some(Boolean))) {
                        writeSectionWithKeep(t.skills, 30);
                        Object.keys(skills).forEach((category) => {
                            const skillList = (Array.isArray(skills[category]) ? skills[category] : [])
                                .map(skill => toStringSafe(skill).trim())
                                .filter(Boolean);

                            if (skillList.length === 0) {
                                return;
                            }

                            const skillBlockHeight = estimateWrappedHeight(`${formatCategoryLabel(category)}:`, contentWidth, pdfTheme.bodySize, 14)
                                + estimateWrappedHeight(skillList.join(', '), contentWidth, pdfTheme.bodySize, 14)
                                + 4;
                            ensurePageSpace(skillBlockHeight);
                            writeWrapped(`${formatCategoryLabel(category)}:`, { bold: true, fontSize: pdfTheme.bodySize, lineHeight: 14, color: [31, 41, 55] });
                            writeWrapped(skillList.join(', '), { fontSize: pdfTheme.bodySize, lineHeight: 14, color: pdfTheme.textColor });
                            y += 4;
                        });
                    }

                    if (projects.length > 0) {
                        writeSectionWithKeep(t.projects, estimateProjectHeight(projects[0]));
                        projects.forEach((proj) => {
                            ensurePageSpace(estimateProjectHeight(proj));
                            writeWrapped(proj.name, { bold: true, fontSize: pdfTheme.itemTitleSize, lineHeight: pdfTheme.itemTitleLineHeight, color: [31, 41, 55] });
                            writeWrapped(proj.technologies, { fontSize: pdfTheme.compactSize, lineHeight: pdfTheme.compactLineHeight, color: pdfTheme.mutedColor });
                            writeWrapped(proj.description, { fontSize: pdfTheme.bodySize, lineHeight: 14, color: pdfTheme.textColor });
                            writeLinkLine(proj.link, proj.link, { fontSize: pdfTheme.bodySize });
                            y += 6;
                        });
                    }

                    if (awards.length > 0) {
                        writeSectionWithKeep(t.awardsCertifications, estimateAwardHeight(awards[0]));
                        awards.forEach((award) => {
                            const awardTitle = [award.name, award.year].map(v => toStringSafe(v).trim()).filter(Boolean).join(' - ');
                            ensurePageSpace(estimateAwardHeight(award));
                            writeWrapped(awardTitle, { bold: true, fontSize: pdfTheme.itemTitleSize, lineHeight: pdfTheme.itemTitleLineHeight, color: [31, 41, 55] });
                            writeWrapped(award.description, { fontSize: pdfTheme.bodySize, lineHeight: 14, color: pdfTheme.textColor });
                            y += 6;
                        });
                    }

                    doc.save(getSafePdfFileName());
                } catch (error) {
                    console.error('Text-based PDF export failed, using fallback:', error);
                    showMessage(t.pdfExportFallback);
                    exportToPdfImage();
                }
            };

            // Function to save all CV data (both locales) to a JSON file
            const saveCvToFile = () => {
                try {
                    const exportPayload = {
                        meta: {
                            schemaVersion: CURRENT_SCHEMA_VERSION,
                            exportedAt: new Date().toISOString(),
                        },
                        data: cvDataByLocale,
                    };
                    const jsonString = JSON.stringify(exportPayload, null, 2); // Pretty print JSON
                    const blob = new Blob([jsonString], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;

                    // Get the name from the current locale's state.
                    const userName = cvDataByLocale[locale].personalInfo.name || 'CV_User';

                    // Sanitize the name to be safe for a filename (replace spaces with underscores, etc.)
                    const sanitizedName = userName.replace(/[^a-z0-9]/gi, '_').toLowerCase();

                    // Construct the new filename
                    a.download = `${sanitizedName}_cv_data.json`;

                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showMessage(t.saveSuccess);
                } catch (error) {
                    console.error("Error saving CV data to file:", error);
                    showMessage(t.saveError);
                }
            };

            // Function to trigger file input click for import
            const triggerImport = () => {
                fileInputRef.current.click();
            };

            // Function to handle file selection and import CV data
            const handleFileSelect = (event) => {
                const file = event.target.files[0];
                if (!file) {
                    showMessage(t.noFileSelected);
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsedData = JSON.parse(e.target.result);
                        const { data: normalizedData, warnings } = normalizeImportedDataWithReport(parsedData);
                        setCvDataByLocale(normalizedData);
                        if (warnings.length > 0) {
                            const warningPreview = warnings.slice(0, 2).join(' ');
                            const moreCount = warnings.length - 2;
                            const moreSuffix = moreCount > 0 ? ` (+${moreCount} more)` : '';
                            showMessage(`${t.loadPartial} ${warningPreview}${moreSuffix}`);
                        } else {
                            showMessage(t.loadSuccess);
                        }
                    } catch (error) {
                        console.error("Error parsing CV data file:", error);
                        showMessage(t.loadError);
                    } finally {
                        // Clear the file input value to allow re-importing the same file
                        event.target.value = null;
                    }
                };
                reader.onerror = (error) => {
                    console.error("Error reading CV data file:", error);
                    showMessage(t.loadError);
                    // Clear the file input value on error as well
                    event.target.value = null;
                };
                reader.readAsText(file);
            };

            // Function to start a new, empty CV session
            const startNewSession = () => {
                // Show confirmation modal before clearing data
                setShowConfirmModal(true);
                setConfirmAction(() => () => {
                    // Reset all CV data for both locales to empty templates
                    setCvDataByLocale({
                        en: createEmptyLocaleData(),
                        es: createEmptyLocaleData(),
                    });
                    showMessage(t.newSessionStarted);
                    setShowConfirmModal(false); // Close modal after action
                });
            };

            const handleConfirm = () => {
                if (confirmAction) {
                    confirmAction();
                }
            };

            const handleCancel = () => {
                setShowConfirmModal(false);
                setConfirmAction(null);
            };


            return (
                <div className="min-h-screen bg-gray-100 p-4 font-inter">
                    {/* Custom Message Modal */}
                    {isMessageVisible && (
                        <div className="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded-lg shadow-xl text-center">
                                <p className="text-lg font-semibold text-gray-800">{message}</p>
                            </div>
                        </div>
                    )}

                    {/* Confirmation Modal */}
                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded-lg shadow-xl text-center max-w-sm mx-auto">
                                <p className="text-lg font-semibold text-gray-800 mb-4">{t.newSessionConfirm}</p>
                                <div className="flex justify-center space-x-4">
                                    <button
                                        onClick={handleConfirm}
                                        className="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition-colors"
                                    >
                                        Yes
                                    </button>
                                    <button
                                        onClick={handleCancel}
                                        className="px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400 transition-colors"
                                    >
                                        No
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto bg-white rounded-lg shadow-xl overflow-hidden md:flex">
                        {/* Input Form Section */}
                        <div className="w-full md:w-1/2 p-6 bg-gray-50 border-r border-gray-200 overflow-y-auto max-h-[calc(100vh-2rem)]">
                            {/* Top Controls */}
                            <div className="flex flex-col sm:flex-row justify-between items-center mb-6 space-y-4 sm:space-y-0 sm:space-x-4">
                                <h1 className="text-3xl font-bold text-gray-800 text-center sm:text-left flex-grow">{t.cvBuilder}</h1>
                                <div className="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-2 w-full sm:w-auto">
                                    <button
                                        onClick={() => setLocale('en')}
                                        className={`px-4 py-2 rounded-md transition-colors w-full sm:w-auto ${locale === 'en' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-800 hover:bg-gray-300'}`}
                                    >
                                        {t.english}
                                    </button>
                                    <button
                                        onClick={() => setLocale('es')}
                                        className={`px-4 py-2 rounded-md transition-colors w-full sm:w-auto ${locale === 'es' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-800 hover:bg-gray-300'}`}
                                    >
                                        {t.spanish}
                                    </button>
                                    <button
                                        onClick={startNewSession}
                                        className="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition-colors shadow-md w-full sm:w-auto"
                                    >
                                        {t.newSession}
                                    </button>
                                </div>
                            </div>

                            {/* Personal Information */}
                            <div className="mb-8 p-4 bg-white rounded-lg shadow-sm">
                                <h2 className="text-xl font-semibold text-gray-700 mb-4">{t.personalInformation}</h2>
                                {Object.keys(personalInfo).filter(key => key !== 'profilePicture' && key !== 'profileFrameColor' && key !== 'profilePictureWidth' && key !== 'profilePictureHeight').map((key) => ( // Exclude picture fields
                                    <div className="mb-3" key={key}>
                                        <label htmlFor={key} className="block text-sm font-medium text-gray-700">
                                            {t[key]}: {/* Use translation for label */}
                                        </label>
                                        <input
                                            type="text"
                                            id={key}
                                            name={key}
                                            value={personalInfo[key]}
                                            onChange={handlePersonalInfoChange}
                                            className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                        />
                                    </div>
                                ))}
                                {/* Profile Picture Input */}
                                <div className="mb-3">
                                    <label htmlFor="profilePicture" className="block text-sm font-medium text-gray-700">
                                        {t.profilePicture}:
                                    </label>
                                    <div className="flex items-center mt-1 space-x-3">
                                        <input
                                            type="file"
                                            id="profilePicture"
                                            ref={imageInputRef}
                                            accept="image/*"
                                            onChange={handleImageUpload}
                                            className="block w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-md file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-50 file:text-blue-700
                        hover:file:bg-blue-100"
                                        />
                                        {personalInfo.profilePicture && (
                                            <button
                                                onClick={removeProfilePicture}
                                                className="p-2 bg-red-500 text-white rounded-full hover:bg-red-600 transition-colors"
                                                title={t.removeImage}
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                </svg>
                                            </button>
                                        )}
                                    </div>
                                    <div className="mt-3">
                                        <label htmlFor="profileFrameColor" className="block text-sm font-medium text-gray-700">
                                            {t.profileFrameColor}:
                                        </label>
                                        <div className="mt-1 flex items-center gap-3">
                                            <input
                                                type="color"
                                                id="profileFrameColor"
                                                name="profileFrameColor"
                                                value={personalInfo.profileFrameColor || '#bfdbfe'}
                                                onChange={handlePersonalInfoChange}
                                                className="h-10 w-16 cursor-pointer rounded border border-gray-300 bg-white p-1"
                                            />
                                            <span className="text-sm text-gray-500">{personalInfo.profileFrameColor || '#bfdbfe'}</span>
                                        </div>
                                    </div>
                                    {personalInfo.profilePicture && (
                                        <div className="mt-4 text-center">
                                            <img
                                                alt="Profile Preview"
                                                src={personalInfo.profilePicture}
                                                className="w-24 h-24 rounded-full object-cover mx-auto border-2 shadow-md"
                                                style={{ borderColor: personalInfo.profileFrameColor || '#bfdbfe' }}
                                            />
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Summary */}
                            <div className="mb-8 p-4 bg-white rounded-lg shadow-sm">
                                <h2 className="text-xl font-semibold text-gray-700 mb-4">{t.summary}</h2>
                                <textarea
                                    value={summary}
                                    onChange={handleSummaryChange}
                                    rows="5"
                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                    placeholder={t.summaryPlaceholder}
                                ></textarea>
                            </div>

                            {/* Work Experience */}
                            <div className="mb-8 p-4 bg-white rounded-lg shadow-sm">
                                <h2 className="text-xl font-semibold text-gray-700 mb-4">{t.workExperience}</h2>
                                {experiences.map((exp) => {
                                    return (
                                        <div key={exp.id} className="mb-6 p-4 border border-gray-200 rounded-md bg-gray-50 relative">
                                            <button
                                                onClick={() => removeExperience(exp.id)}
                                                className="absolute top-2 right-2 p-1 bg-red-500 text-white rounded-full hover:bg-red-600 transition-colors"
                                                title={t.removeExperience}
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                                                </svg>
                                            </button>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.jobTitle}:</label>
                                                <input
                                                    type="text"
                                                    value={exp.title}
                                                    onChange={(e) => handleExperienceChange(exp.id, 'title', e.target.value)}
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                />
                                            </div>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.company}:</label>
                                                <input
                                                    type="text"
                                                    value={exp.company}
                                                    onChange={(e) => handleExperienceChange(exp.id, 'company', e.target.value)}
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                />
                                            </div>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.location}:</label>
                                                <input
                                                    type="text"
                                                    value={exp.location}
                                                    onChange={(e) => handleExperienceChange(exp.id, 'location', e.target.value)}
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                />
                                            </div>
                                            <div className="grid grid-cols-2 gap-4 mb-3">
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700">{t.startDate}:</label>
                                                    <input
                                                        type="text"
                                                        value={exp.startDate}
                                                        onChange={(e) => handleExperienceChange(exp.id, 'startDate', e.target.value)}
                                                        className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700">{t.endDate}:</label>
                                                    <input
                                                        type="text"
                                                        value={exp.endDate}
                                                        onChange={(e) => handleExperienceChange(exp.id, 'endDate', e.target.value)}
                                                        className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                    />
                                                </div>
                                            </div>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.responsibilitiesAchievements}:</label>
                                                {exp.description.map((desc, index) => {
                                                    return (
                                                        <div key={index} className="flex items-center mt-1">
                                                            <textarea
                                                                value={desc}
                                                                onChange={(e) => handleExperienceChange(exp.id, 'description', e.target.value, index)}
                                                                rows="2"
                                                                className="flex-grow px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm mr-2"
                                                                placeholder={t.responsibilitiesAchievementsPlaceholder}
                                                            ></textarea>
                                                            <button
                                                                onClick={() => removeExperienceDescriptionLine(exp.id, index)}
                                                                className="p-1 bg-red-400 text-white rounded-full hover:bg-red-500 transition-colors"
                                                                title={t.removeLine}
                                                            >
                                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M20 12H4" />
                                                                </svg>
                                                            </button>
                                                        </div>
                                                    );
                                                })}
                                                <button
                                                    onClick={() => addExperienceDescriptionLine(exp.id)}
                                                    className="mt-2 px-3 py-1 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors text-sm"
                                                >
                                                    {t.addDescriptionLine}
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                                <button
                                    onClick={addExperience}
                                    className="w-full px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition-colors shadow-md"
                                >
                                    {t.addExperience}
                                </button>
                            </div>

                            {/* Education */}
                            <div className="mb-8 p-4 bg-white rounded-lg shadow-sm">
                                <h2 className="text-xl font-semibold text-gray-700 mb-4">{t.education}</h2>
                                {education.map((edu) => {
                                    return (
                                        <div key={edu.id} className="mb-6 p-4 border border-gray-200 rounded-md bg-gray-50 relative">
                                            <button
                                                onClick={() => removeEducation(edu.id)}
                                                className="absolute top-2 right-2 p-1 bg-red-500 text-white rounded-full hover:bg-red-600 transition-colors"
                                                title={t.removeEducation}
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                                                </svg>
                                            </button>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.degree}:</label>
                                                <input
                                                    type="text"
                                                    value={edu.degree}
                                                    onChange={(e) => handleEducationChange(edu.id, 'degree', e.target.value)}
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                />
                                            </div>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.university}:</label>
                                                <input
                                                    type="text"
                                                    value={edu.university}
                                                    onChange={(e) => handleEducationChange(edu.id, 'university', e.target.value)}
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                />
                                            </div>
                                            <div className="grid grid-cols-2 gap-4 mb-3">
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700">{t.location}:</label>
                                                    <input
                                                        type="text"
                                                        value={edu.location}
                                                        onChange={(e) => handleEducationChange(edu.id, 'location', e.target.value)}
                                                        className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700">{t.year}:</label>
                                                    <input
                                                        type="text"
                                                        value={edu.year}
                                                        onChange={(e) => handleEducationChange(edu.id, 'year', e.target.value)}
                                                        className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                    />
                                                </div>
                                            </div>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.detailsOptional}:</label>
                                                <textarea
                                                    value={edu.details}
                                                    onChange={(e) => handleEducationChange(edu.id, 'details', e.target.value)}
                                                    rows="2"
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                    placeholder={t.detailsPlaceholder}
                                                ></textarea>
                                            </div>
                                        </div>
                                    );
                                })}
                                <button
                                    onClick={addEducation}
                                    className="w-full px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition-colors shadow-md"
                                >
                                    {t.addEducation}
                                </button>
                            </div>

                            {/* Skills */}
                            <div className="mb-8 p-4 bg-white rounded-lg shadow-sm">
                                <h2 className="text-xl font-semibold text-gray-700 mb-4">{t.skills}</h2>
                                {Object.keys(skills).map((category) => {
                                    const skillValues = Array.isArray(skills[category]) ? skills[category] : [];
                                    return (
                                        <div key={category} className="mb-6 p-4 border border-gray-200 rounded-md bg-gray-50">
                                            <h3 className="text-lg font-medium text-gray-700 mb-3">{formatCategoryLabel(category)}:</h3>
                                            {skillValues.map((skill, index) => {
                                                return (
                                                    <div key={index} className="flex items-center mb-2">
                                                        <input
                                                            type="text"
                                                            value={skill}
                                                            onChange={(e) => handleSkillsChange(category, index, e.target.value)}
                                                            className="flex-grow px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm mr-2"
                                                        />
                                                        <button
                                                            onClick={() => removeSkill(category, index)}
                                                            className="p-1 bg-red-400 text-white rounded-full hover:bg-red-500 transition-colors"
                                                            title={t.removeSkill}
                                                        >
                                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                                                <path strokeLinecap="round" strokeLinejoin="round" d="M20 12H4" />
                                                            </svg>
                                                        </button>
                                                    </div>
                                                );
                                            })}
                                            <button
                                                onClick={() => addSkill(category)}
                                                className="mt-2 px-3 py-1 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors text-sm"
                                            >
                                                {t.addSkill}
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Projects */}
                            <div className="mb-8 p-4 bg-white rounded-lg shadow-sm">
                                <h2 className="text-xl font-semibold text-gray-700 mb-4">{t.projects}</h2>
                                {projects.map((proj) => {
                                    return (
                                        <div key={proj.id} className="mb-6 p-4 border border-gray-200 rounded-md bg-gray-50 relative">
                                            <button
                                                onClick={() => removeProject(proj.id)}
                                                className="absolute top-2 right-2 p-1 bg-red-500 text-white rounded-full hover:bg-red-600 transition-colors"
                                                title={t.removeProject}
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                                                </svg>
                                            </button>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.projectName}:</label>
                                                <input
                                                    type="text"
                                                    value={proj.name}
                                                    onChange={(e) => handleProjectChange(proj.id, 'name', e.target.value)}
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                />
                                            </div>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.technologiesUsed}:</label>
                                                <input
                                                    type="text"
                                                    value={proj.technologies}
                                                    onChange={(e) => handleProjectChange(proj.id, 'technologies', e.target.value)}
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                />
                                            </div>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.projectDescription}:</label>
                                                <textarea
                                                    value={proj.description}
                                                    onChange={(e) => handleProjectChange(proj.id, 'description', e.target.value)}
                                                    rows="3"
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                    placeholder={t.projectDescriptionPlaceholder}
                                                ></textarea>
                                            </div>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.linkOptional}:</label>
                                                <input
                                                    type="text"
                                                    value={proj.link}
                                                    onChange={(e) => handleProjectChange(proj.id, 'link', e.target.value)}
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                />
                                            </div>
                                        </div>
                                    );
                                })}
                                <button
                                    onClick={addProject}
                                    className="w-full px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition-colors shadow-md"
                                >
                                    {t.addProject}
                                </button>
                            </div>

                            {/* Awards/Certifications */}
                            <div className="mb-8 p-4 bg-white rounded-lg shadow-sm">
                                <h2 className="text-xl font-semibold text-gray-700 mb-4">{t.awardsCertifications}</h2>
                                {awards.map((award) => {
                                    return (
                                        <div key={award.id} className="mb-6 p-4 border border-gray-200 rounded-md bg-gray-50 relative">
                                            <button
                                                onClick={() => removeAward(award.id)}
                                                className="absolute top-2 right-2 p-1 bg-red-500 text-white rounded-full hover:bg-red-600 transition-colors"
                                                title={t.removeAward}
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                                                </svg>
                                            </button>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.awardName}:</label>
                                                <input
                                                    type="text"
                                                    value={award.name}
                                                    onChange={(e) => handleAwardChange(award.id, 'name', e.target.value)}
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                />
                                            </div>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.awardYear}:</label>
                                                <input
                                                    type="text"
                                                    value={award.year}
                                                    onChange={(e) => handleAwardChange(award.id, 'year', e.target.value)}
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                />
                                            </div>
                                            <div className="mb-3">
                                                <label className="block text-sm font-medium text-gray-700">{t.awardDescriptionOptional}:</label>
                                                <textarea
                                                    value={award.description}
                                                    onChange={(e) => handleAwardChange(award.id, 'description', e.target.value)}
                                                    rows="2"
                                                    className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                                    placeholder={t.awardDescriptionPlaceholder}
                                                ></textarea>
                                            </div>
                                        </div>
                                    );
                                })}
                                <button
                                    onClick={addAward}
                                    className="w-full px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition-colors shadow-md"
                                >
                                    {t.addAwardCertification}
                                </button>
                            </div>

                            {/* Bottom Controls */}
                            <div className="mt-8 flex flex-col space-y-4">
                                <button
                                    onClick={exportToPdf}
                                    className="w-full px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-md hover:bg-blue-700 transition-colors shadow-lg flex items-center justify-center space-x-2"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                    </svg>
                                    <span>{t.exportToPdfText || t.exportToPdf}</span>
                                </button>
                                <button
                                    onClick={exportToPdfImage}
                                    className="w-full px-6 py-3 bg-slate-600 text-white text-lg font-semibold rounded-md hover:bg-slate-700 transition-colors shadow-lg flex items-center justify-center space-x-2"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M3 7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7zm3 7l3-3 2 2 3-3 4 4" />
                                    </svg>
                                    <span>{t.exportToPdfImage || t.exportToPdf}</span>
                                </button>
                                <button
                                    onClick={saveCvToFile}
                                    className="w-full px-6 py-3 bg-purple-600 text-white text-lg font-semibold rounded-md hover:bg-purple-700 transition-colors shadow-lg flex items-center justify-center space-x-2"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M8 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-2m-4-1v8m0-8V4m0 8h.01M12 4a2 2 0 00-2 2v4a2 2 0 002 2h4a2 2 0 002-2V6a2 2 0 00-2-2h-4z" />
                                    </svg>
                                    <span>{t.exportCvSession}</span>
                                </button>
                                <input
                                    type="file"
                                    ref={fileInputRef}
                                    style={{ display: 'none' }}
                                    onChange={handleFileSelect}
                                    accept=".json" // Only accept JSON files
                                />
                                <button
                                    onClick={triggerImport}
                                    className="w-full px-6 py-3 bg-orange-600 text-white text-lg font-semibold rounded-md hover:bg-orange-700 transition-colors shadow-lg flex items-center justify-center space-x-2"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                    </svg>
                                    <span>{t.importCvSession}</span>
                                </button>
                            </div>
                        </div>

                        {/* CV Preview Section */}
                        <div className="w-full md:w-1/2 p-6 bg-white overflow-y-auto max-h-[calc(100vh-2rem)]">
                            <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center">{t.cvPreview}</h2>
                            <div ref={cvContentRef} className="cv-document p-8 bg-white shadow-lg rounded-lg">
                                {/* Personal Information */}
                                <div className="text-center mb-6">
                                    {personalInfo.profilePicture && (
                                        <div
                                            className="w-32 h-32 rounded-full mx-auto mb-4 border-4 shadow-lg overflow-hidden flex items-center justify-center"
                                            style={{ borderColor: personalInfo.profileFrameColor || '#bfdbfe' }}
                                        > {/* Added flex for centering */}
                                            <img
                                                src={personalInfo.profilePicture}
                                                alt="Profile"
                                                // Use explicitly calculated dimensions for PDF export reliability
                                                width={personalInfo.profilePictureWidth || 150}
                                                height={personalInfo.profilePictureHeight || 150}
                                                style={{ objectFit: 'cover' }} // Keep object-fit for visual consistency in browser
                                            />
                                        </div>
                                    )}
                                    <h1 className="text-4xl font-bold text-gray-900 mb-1">{personalInfo.name}</h1>
                                    <p className="text-xl text-gray-700 mb-3">{personalInfo.title}</p>
                                    <div className="flex flex-wrap justify-center text-gray-600 text-sm">
                                        {personalInfo.email && <span className="mx-2">{personalInfo.email}</span>}
                                        {personalInfo.phone && <span className="mx-2">{personalInfo.phone}</span>}
                                        {personalInfo.linkedin && <a href={`https://${personalInfo.linkedin}`} target="_blank" rel="noopener noreferrer" className="mx-2 text-blue-600 hover:underline">{personalInfo.linkedin}</a>}
                                        {personalInfo.github && <a href={`https://${personalInfo.github}`} target="_blank" rel="noopener noreferrer" className="mx-2 text-blue-600 hover:underline">{personalInfo.github}</a>}
                                        {personalInfo.website && <a href={`https://${personalInfo.website}`} target="_blank" rel="noopener noreferrer" className="mx-2 text-blue-600 hover:underline">{personalInfo.website}</a>}
                                        {personalInfo.address && <span className="mx-2">{personalInfo.address}</span>}
                                    </div>
                                </div>

                                {/* Summary */}
                                {summary && (
                                    <div className="mb-6 no-break-inside">
                                        <h3 className="text-lg cv-section-title">{t.summary}</h3>
                                        <p className="text-gray-700 leading-relaxed">{summary}</p>
                                    </div>
                                )}

                                {/* Work Experience */}
                                {experiences.length > 0 && (
                                    <div className="mb-6">
                                        <h3 className="text-lg cv-section-title">{t.workExperience}</h3>
                                        {experiences.map((exp) => {
                                            return (
                                                <div key={exp.id} className="mb-4 no-break-inside">
                                                    <h4 className="cv-item-title text-md">{exp.title}</h4>
                                                    <p className="cv-item-subtitle text-sm">{exp.company} | {exp.location}</p>
                                                    <p className="cv-item-dates text-xs mb-2">{exp.startDate} - {exp.endDate === 'Present' ? t.present : exp.endDate}</p>
                                                    <ul className="cv-description-list text-sm">
                                                        {exp.description.filter(Boolean).map((desc, index) => {
                                                            return (
                                                                <li key={index}>{desc}</li>
                                                            );
                                                        })}
                                                    </ul>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {/* Education */}
                                {education.length > 0 && (
                                    <div className="mb-6">
                                        <h3 className="text-lg cv-section-title">{t.education}</h3>
                                        {education.map((edu) => {
                                            return (
                                                <div key={edu.id} className="mb-4 no-break-inside">
                                                    <h4 className="cv-item-title text-md">{edu.degree}</h4>
                                                    <p className="cv-item-subtitle text-sm">{edu.university} | {edu.location}</p>
                                                    <p className="cv-item-dates text-xs mb-2">{edu.year}</p>
                                                    {edu.details && <p className="text-gray-700 text-sm">{edu.details}</p>}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {/* Skills */}
                                {Object.values(skills).some(arr => Array.isArray(arr) && arr.length > 0 && arr.some(Boolean)) && (
                                    <div className="mb-6">
                                        <h3 className="text-lg cv-section-title">{t.skills}</h3>
                                        {Object.keys(skills).map((category) => {
                                            const skillValues = Array.isArray(skills[category]) ? skills[category] : [];
                                            return (
                                                <div key={category} className="mb-4">
                                                    <h3 className="text-lg font-medium text-gray-700 text-md">{formatCategoryLabel(category)}:</h3>
                                                    {skillValues.map((skill, index) => {
                                                        return (
                                                            <div key={index} className="flex items-center mb-2 no-break-inside">
                                                                <p className="cv-item-subtitle text-sm mb-1">{skill}</p>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {/* Projects */}
                                {projects.length > 0 && (
                                    <div className="mb-6 no-break-inside">
                                        <h3 className="text-lg cv-section-title">{t.projects}</h3>
                                        {projects.map((proj) => {
                                            return (
                                                <div key={proj.id} className="mb-4 no-break-inside">
                                                    <h4 className="cv-item-title text-md">{proj.name}</h4>
                                                    <p className="cv-item-subtitle text-sm mb-1">{proj.technologies}</p>
                                                    <p className="text-gray-700 text-sm leading-relaxed">{proj.description}</p>
                                                    {proj.link && (
                                                        <p className="text-sm">
                                                            <a href={`https://${proj.link}`} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline">
                                                                {proj.link}
                                                            </a>
                                                        </p>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {/* Awards/Certifications */}
                                {awards.length > 0 && (
                                    <div className="mb-6 ">
                                        <h3 className="text-lg cv-section-title">{t.awardsCertifications}</h3>
                                        {awards.map((award) => {
                                            return (
                                                <div key={award.id} className="mb-4 no-break-inside">
                                                    <h4 className="cv-item-title text-md">{award.name}</h4>
                                                    <p className="cv-item-subtitle text-sm mb-1">{award.year}</p>
                                                    {award.description && <p className="text-gray-700 text-sm leading-relaxed">{award.description}</p>}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
